{% extends 'base.html' %}
{% load static %}

{% block title %}Defects | DefectSys{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 style="font-weight: 300;">
        <i class="fa-solid fa-list-check me-2 text-secondary"></i> Defect Tracking
    </h2>
    <button id="reportDefectBtn" class="btn btn-gh-primary" data-bs-target="#createDefectModal" data-bs-toggle="modal">
        <i class="fa-solid fa-plus me-1"></i> Report Defect
    </button>
</div>

<div class="gh-card mb-4">
    <div class="gh-card-body pb-2 pt-3">
        <form id="filterForm" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label" style="font-size: 13px; color: #8b949e;">Search</label>
                <input type="text" class="form-control form-control-sm" id="searchFilter" placeholder="Search by title...">
            </div>
            <div class="col-md-2">
                <label class="form-label" style="font-size: 13px; color: #8b949e;">Status</label>
                <select class="form-select form-select-sm" id="statusFilter">
                    <option value="">All</option>
                    <option value="New">New</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Reopened">Reopened</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label" style="font-size: 13px; color: #8b949e;">Severity</label>
                <select class="form-select form-select-sm" id="severityFilter">
                    <option value="">All</option>
                    <option value="Critical">Critical</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label" style="font-size: 13px; color: #8b949e;">Sort By</label>
                <select class="form-select form-select-sm" id="orderFilter">
                    <option value="-created_at">Newest first</option>
                    <option value="-calculated_risk">Highest Risk</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-sm btn-gh-secondary">Apply Filters</button>
            </div>
        </form>
    </div>
</div>

<div class="gh-card">
    <div class="gh-card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0" style="background-color: transparent;">
                <thead>
                    <tr style="border-bottom: 1px solid #30363d; font-size: 13px; color: #8b949e;">
                        <th class="ps-3 py-3">ID / Title</th>
                        <th>Module</th>
                        <th>Status</th>
                        <th>Severity</th>
                        <th>Risk Score</th>
                        <th>Reporter</th>
                        <th class="text-end pe-3">Action</th>
                    </tr>
                </thead>
                <tbody id="defectsTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="createDefectModal" tabindex="-1" data-bs-theme="dark">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" style="background-color: #161b22; border: 1px solid #30363d;">
            <div class="modal-header" style="border-bottom: 1px solid #30363d;">
                <h5 class="modal-title">Create New Defect</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="createDefectForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Defect Title</label>
                        <input type="text" class="form-control" id="defTitle" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary">Target Module</label>
                            <select class="form-select" id="defModule" required>
                                <!-- Заповнюється через JS -->
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary">Severity</label>
                            <select class="form-select" id="defSeverity" required>
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Steps to Reproduce</label>
                        <textarea class="form-control" id="defSteps" rows="5" required
                                  placeholder="1. Go to...\n2. Click on...\n3. Expected behavior:\n4. Actual behavior:"></textarea>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #30363d;">
                    <button type="button" class="btn btn-gh-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-gh-primary">Submit Defect</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/defects.js' %}?v=2"></script>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Defect System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <i class="fa-solid fa-bug fa-2x mb-3 text-secondary"></i>
        <h1>Sign in to DefectSys</h1>
    </div>

    <div class="auth-card">
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <div class="auth-divider"><span>OR</span></div>

        <button class="btn btn-google">
            <i class="fa-brands fa-google me-2"></i> Sign in with Google
        </button>
    </div>

    <div class="auth-footer">
        New to DefectSys? <a href="/register/">Create an account</a>.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/auth.js' %}"></script>

</body>
</html>
